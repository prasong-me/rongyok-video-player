name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# The workflow can deploy to GitHub Pages, but it cannot enable Pages
# through the repository settings. Enable Pages manually with:
# Settings > Pages > Source: GitHub Actions
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./app

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
