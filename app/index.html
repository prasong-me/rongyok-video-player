<!doctype html><html lang="th"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

</head><body><main class="app">
<header class="navbar"><div class="navbar-content"><div class="navbar-brand"><span class="brand-icon">▶</span><h1>Rongyok Player</h1></div>

<section class="main-content"><div id="home-tab" class="tab-content active">
